[build]
  publish = "build"
  command = "npm run build"

# Voice backend lives on the VPS, reached through the Cloudflare tunnel.
# Proxy same-origin /api/* → the tunnel so the browser never does a
# cross-origin call (no CORS, no login hang). The user only ever visits
# dyno.harryschlechter.com/voice; voice.harryschlechter.com is now just the
# invisible backend endpoint.
[[redirects]]
  from = "/api/*"
  to = "https://voice.harryschlechter.com/api/:splat"
  status = 200
  force = true

# Public portfolio demo. Same bundle, same deploy — /sample just tells the app
# at runtime to bypass auth and read the in-memory fixture instead of Supabase
# (see src/lib/demoMode.ts). Listed before the catch-all so the intent is
# explicit rather than incidental.
[[redirects]]
  from = "/sample"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/sample/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
