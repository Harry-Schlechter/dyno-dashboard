# Netlify config for the PUBLIC PORTFOLIO DEMO deploy.
#
# This is a separate Netlify site from the real dashboard. It builds with
# REACT_APP_DEMO=1, which swaps the Supabase client for an in-memory fixture —
# so this deploy has no database connection, no credentials, and no real data.
#
# Point this site at the repo with:
#   Base directory:    dyno-dashboard
#   Build command:     npm run build:demo
#   Publish directory: build
#   Config path:       netlify.demo.toml   (Site config → Build & deploy)
#
# Do NOT set REACT_APP_SUPABASE_URL / _ANON_KEY / _USER_ID on this site.
# The demo build never reads them, and leaving them unset guarantees it.

[build]
  publish = "build"
  command = "npm run build:demo"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"
  REACT_APP_DEMO = "1"
  PUBLIC_URL = "/sample"

# The app is served under /sample, so every deep link inside it rewrites back to
# the SPA entry point. Without this, a refresh on /sample/patterns 404s.
[[redirects]]
  from = "/sample/*"
  to = "/sample/index.html"
  status = 200

# Bare /sample (no trailing slash) → the app.
[[redirects]]
  from = "/sample"
  to = "/sample/index.html"
  status = 200

# Anything outside /sample on this site is not part of the demo; send it in.
[[redirects]]
  from = "/*"
  to = "/sample/index.html"
  status = 200

# The demo is a public showcase — let it be indexed, but keep it clearly
# separate from the private dashboard.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
